x-airflow-common:
  &airflow-common
  image: aith-devops-labs-airflow:2.7.1
  build:
    context: .
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark:/opt/airflow/spark
    - ./reports:/opt/airflow/reports
    - ./logs/airflow:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    spark-master:
      condition: service_started
    spark-worker:
      condition: service_started

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow connections delete spark_default >/dev/null 2>&1 || true &&
        airflow connections add spark_default \
          --conn-type spark \
          --conn-host 'spark://spark-master' \
          --conn-port 7077 &&
        airflow users create \
          --role Admin \
          --username admin \
          --password admin \
          --firstname Airflow \
          --lastname Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "4040:4040"
    restart: unless-stopped

  spark-master:
    image: spark:3.5.0-python3
    container_name: spark-master
    hostname: spark-master
    user: root
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/spark/logs
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master 2>&1 | tee -a /opt/spark/logs/spark-master.log
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark:/opt/spark/jobs
      - ./spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ./logs/spark:/opt/spark/logs
    restart: unless-stopped

  spark-worker:
    image: spark:3.5.0-python3
    container_name: spark-worker
    hostname: spark-worker
    user: root
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/spark/logs
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 2>&1 | tee -a /opt/spark/logs/spark-worker.log
    environment:
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1G
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./spark:/opt/spark/jobs
      - ./spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ./logs/spark:/opt/spark/logs
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./logs:/opt/logs:ro
      - ./alloy.conf:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - spark-master
      - spark-worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab4-observability.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
